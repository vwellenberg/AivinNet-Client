<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <!-- Memphis doodle tile — direct copy of the 90s reference art
       (design-refs/memphis-reference.png, gitignored): same composition at 2x
       scale (reference canvas 750x480). Shapes use the reference's artwork
       colours on purpose (ground art, not UI tokens). Tiled over the grid by
       mem-grid; the grid lines themselves stay a CSS layer so they align
       across the page. -->
  <defs>
    <!-- dark terrazzo squiggles + dots on the indigo slabs -->
    <pattern id="tz" width="46" height="46" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#232046" stroke-width="4" stroke-linecap="round">
        <path d="M6 10 q5 -6 10 0 t10 0"/>
        <path d="M26 30 q5 -6 10 0 t10 0"/>
        <path d="M2 36 q4 -5 8 0"/>
      </g>
      <g fill="#232046">
        <circle cx="36" cy="10" r="3"/>
        <circle cx="14" cy="24" r="3"/>
        <circle cx="42" cy="42" r="3"/>
      </g>
    </pattern>
    <!-- white sprinkles on the teal book panel -->
    <pattern id="spr" width="42" height="42" patternUnits="userSpaceOnUse">
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
        <line x1="6" y1="9" x2="14" y2="13"/>
        <line x1="27" y1="5" x2="34" y2="2"/>
        <line x1="34" y1="24" x2="40" y2="29"/>
        <line x1="12" y1="31" x2="19" y2="28"/>
        <line x1="24" y1="39" x2="31" y2="37"/>
      </g>
    </pattern>
  </defs>

  <!-- Volume dial: the full-strength copy (tag memphis-ref-full-v1.2.6) was
       too loud as an app ground — this group opacity blends the artwork
       toward the previous subtle look while keeping the copied composition. -->
  <g opacity="0.62">

  <!-- ============ big soft shapes (back layer) ============ -->
  <!-- orchid circle (left) -->
  <circle cx="320" cy="490" r="150" fill="#C36BBE"/>
  <!-- pink circle (centre) -->
  <circle cx="800" cy="345" r="115" fill="#F2A9C4"/>
  <!-- gold circle (bottom centre, sits behind the teal book) -->
  <circle cx="985" cy="845" r="170" fill="#F0A23C"/>

  <!-- ============ top-left group ============ -->
  <!-- small gold 3D box -->
  <g transform="translate(60,18) rotate(-18)">
    <rect x="10" y="12" width="150" height="44" fill="#2B2733"/>
    <rect x="0" y="0" width="150" height="44" fill="#F0A23C"/>
    <rect x="0" y="0" width="150" height="12" fill="#E2574C"/>
  </g>
  <!-- pink plank with red edge + hard shadow -->
  <g transform="translate(195,100) rotate(24)">
    <rect x="12" y="14" width="230" height="52" fill="#2B2733"/>
    <rect x="0" y="0" width="230" height="52" fill="#F0A6B8"/>
    <rect x="0" y="38" width="230" height="14" fill="#E2574C"/>
  </g>

  <!-- big teal triangle — apex points DOWN like the reference -->
  <polygon points="360,210 660,30 490,430" fill="#66C7B8"/>

  <!-- indigo bold squiggle with hard shadow (top centre) -->
  <path d="M530 40 q60 -45 74 22 q10 52 62 30 q46 -20 44 42 q-2 44 40 34"
        fill="none" stroke="#2B2733" stroke-width="26" stroke-linecap="round" transform="translate(9,11)"/>
  <path d="M530 40 q60 -45 74 22 q10 52 62 30 q46 -20 44 42 q-2 44 40 34"
        fill="none" stroke="#5B67C9" stroke-width="26" stroke-linecap="round"/>

  <!-- gold arc (half ring, opening down) -->
  <path d="M840 190 A 95 95 0 0 1 1030 190 L 972 190 A 37 37 0 0 0 898 190 Z" fill="#F0A23C"/>

  <!-- pink/red 3D box cut by the top edge (top right) -->
  <g transform="translate(1052,-30) rotate(14)">
    <rect x="10" y="12" width="120" height="50" fill="#2B2733"/>
    <rect x="0" y="0" width="120" height="50" fill="#F0A6B8"/>
    <rect x="0" y="0" width="120" height="16" fill="#E2574C"/>
  </g>

  <!-- teal squiggle (top right edge) with shadow -->
  <path d="M1408 118 q52 -34 62 18 q8 44 -34 52 q-40 8 -28 52"
        fill="none" stroke="#2B2733" stroke-width="22" stroke-linecap="round" transform="translate(8,9)"/>
  <path d="M1408 118 q52 -34 62 18 q8 44 -34 52 q-40 8 -28 52"
        fill="none" stroke="#3EBFAF" stroke-width="22" stroke-linecap="round"/>

  <!-- right-side beam: teal top / gold face / red stripe, hard shadow -->
  <g transform="translate(1120,208) rotate(12)">
    <rect x="14" y="16" width="270" height="60" fill="#2B2733"/>
    <rect x="0" y="0" width="270" height="60" fill="#F0A23C"/>
    <rect x="0" y="0" width="270" height="18" fill="#3EBFAF"/>
    <rect x="0" y="46" width="270" height="14" fill="#E2574C"/>
  </g>

  <!-- left indigo terrazzo slab with pink edge -->
  <g transform="translate(-40,290) rotate(32)">
    <rect x="16" y="18" width="420" height="96" fill="#2B2733"/>
    <rect x="0" y="0" width="420" height="96" fill="#5560BD"/>
    <rect x="0" y="0" width="420" height="96" fill="url(#tz)"/>
    <rect x="0" y="0" width="420" height="18" fill="#F0A6B8"/>
  </g>

  <!-- light-blue zigzag strip (over the pink circle) -->
  <g transform="translate(676,292) rotate(-8)">
    <polygon points="8,58 58,10 108,58 158,10 208,58 258,10 268,20 208,78 158,30 108,78 58,30 18,68"
             fill="#2B2733"/>
    <polygon points="0,48 50,0 100,48 150,0 200,48 250,0 260,10 200,68 150,20 100,68 50,20 10,58"
             fill="#ACD9E8" stroke="#2B2733" stroke-width="4"/>
  </g>

  <!-- red scribble zigzag with shadow -->
  <path d="M1000 420 l46 -34 8 40 50 -36 8 40 50 -38 8 38 44 -32"
        fill="none" stroke="#2B2733" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="translate(7,9)"/>
  <path d="M1000 420 l46 -34 8 40 50 -36 8 40 50 -38 8 38 44 -32"
        fill="none" stroke="#D9603F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small gold ring -->
  <circle cx="1338" cy="486" r="26" fill="#F4F2ED"/>
  <circle cx="1338" cy="486" r="26" fill="none" stroke="#F0A23C" stroke-width="14"/>
  <circle cx="1338" cy="486" r="34" fill="none" stroke="#2B2733" stroke-width="4"/>
  <circle cx="1338" cy="486" r="18" fill="none" stroke="#2B2733" stroke-width="4"/>

  <!-- gold flag / pennant -->
  <g transform="translate(580,462) rotate(10)">
    <polygon points="10,12 130,12 96,44 130,76 10,76" fill="#2B2733" transform="translate(8,9)"/>
    <polygon points="0,0 120,0 86,32 120,64 0,64" fill="#F0A23C"/>
  </g>

  <!-- teal squiggle (below the orchid circle) with shadow -->
  <path d="M300 572 q54 -38 66 16 q10 46 -36 54 q-44 10 -30 56"
        fill="none" stroke="#2B2733" stroke-width="20" stroke-linecap="round" transform="translate(8,9)"/>
  <path d="M300 572 q54 -38 66 16 q10 46 -36 54 q-44 10 -30 56"
        fill="none" stroke="#3EBFAF" stroke-width="20" stroke-linecap="round"/>

  <!-- indigo terrazzo prism (small 3D triangle) -->
  <g transform="translate(490,680) rotate(-14)">
    <polygon points="72,10 140,110 12,110" fill="#2B2733" transform="translate(10,10)"/>
    <polygon points="60,0 128,100 0,100" fill="#5560BD"/>
    <polygon points="60,0 128,100 0,100" fill="url(#tz)"/>
    <polygon points="60,0 128,100 60,100" fill="#3E4890"/>
  </g>

  <!-- the teal "book": sprinkle panel + plain panel, hard shadow -->
  <g transform="translate(742,628) rotate(8)">
    <rect x="18" y="20" width="310" height="180" fill="#2B2733"/>
    <rect x="0" y="0" width="150" height="180" fill="#35B5A5" stroke="#2B2733" stroke-width="5"/>
    <rect x="0" y="0" width="150" height="180" fill="url(#spr)"/>
    <rect x="150" y="0" width="160" height="180" fill="#3EBFAF" stroke="#2B2733" stroke-width="5"/>
  </g>

  <!-- bottom-left beam: pink top / red stripe / teal end -->
  <g transform="translate(56,796) rotate(-8)">
    <rect x="14" y="16" width="250" height="58" fill="#2B2733"/>
    <rect x="0" y="0" width="250" height="58" fill="#F0A6B8"/>
    <rect x="0" y="0" width="250" height="16" fill="#E2574C"/>
    <rect x="216" y="0" width="34" height="58" fill="#3EBFAF"/>
  </g>

  <!-- teal small squiggle (bottom left of the book) -->
  <path d="M382 776 q44 -30 54 14 q8 38 -30 44 q-36 8 -24 44"
        fill="none" stroke="#3EBFAF" stroke-width="16" stroke-linecap="round"/>

  <!-- light-blue zigzag strip #2 (right) -->
  <g transform="translate(1226,616) rotate(6)">
    <polygon points="6,46 46,8 86,46 126,8 166,46 206,8 214,16 166,62 126,24 86,62 46,24 14,54"
             fill="#2B2733"/>
    <polygon points="0,40 40,2 80,40 120,2 160,40 200,2 208,10 160,56 120,18 80,56 40,18 8,48"
             fill="#ACD9E8" stroke="#2B2733" stroke-width="4"/>
  </g>

  <!-- pink streamer squiggle (bottom right) with shadow -->
  <path d="M1280 812 q66 -50 84 16 q16 58 -48 66 q-58 10 -42 66"
        fill="none" stroke="#2B2733" stroke-width="22" stroke-linecap="round" transform="translate(9,10)"/>
  <path d="M1280 812 q66 -50 84 16 q16 58 -48 66 q-58 10 -42 66"
        fill="none" stroke="#EFA0C8" stroke-width="22" stroke-linecap="round"/>

  <!-- small pink squiggle (bottom, left of centre) -->
  <path d="M1160 918 q40 -28 50 12 q8 34 -28 40" fill="none" stroke="#EFA0C8" stroke-width="14" stroke-linecap="round"/>

  </g>
</svg>
